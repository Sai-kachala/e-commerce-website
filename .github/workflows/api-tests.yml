name: API tests

on:
  push:
    paths:
      - "main.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "main.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/api-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
